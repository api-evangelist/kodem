  name: Kodem API
  description: 'The Kodem platform API. The service is reachable at https://api.kodemsecurity.com and is
    fully authenticated — every path returns HTTP 401 with a JSON {"detail":"Unauthorized"} envelope until
    a credential is supplied. The CORS preflight advertises an x-kodem-apikey request header alongside
    authorization, and the allowed methods are GET, POST, PUT, DELETE, and OPTIONS. No OpenAPI, Swagger,
    or public reference is published; product documentation sits behind the application login at docs.kodemsecurity.com.'
