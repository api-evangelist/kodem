aid: kodem
name: Kodem
description: 'Kodem Security is an AI-native application security platform built on runtime intelligence,
  founded in 2021 by Aviv Mussinger, Idan Bartura, and Pavel Furman. Kodem connects code analysis, runtime
  evidence, AI reasoning, and runtime protection into a single system so security teams prioritize and
  fix what is actually exploitable in production rather than triaging every theoretical finding. The platform
  spans runtime-powered software composition analysis (SCA) across transitive and OS-level dependencies,
  native SAST powered by Opengrep with 1,000+ rules plus secrets detection, and Application Detection &
  Response (ADR) that detects exploit attempts at the application layer without signatures. Its AI layer,
  Kai, is grounded in function-level runtime evidence to accelerate triage, prioritization, and repository-grounded
  remediation. Kodem is SOC 2 Type II and deploys across cloud and on-premise environments in about five
  minutes.'
